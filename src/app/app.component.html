<div class="p-6">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold text-white">Task Management Board</h1>
    <button
      (click)="openDialog()"
      class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded"
    >
      <i data-lucide="plus" class="mr-2 h-4 w-4"></i>
      Add New Task
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div *ngFor="let column of columns" class="space-y-4">
      <h2 class="text-xl font-semibold text-gray-200">{{ column.title }}</h2>
      <div
        *ngFor="let task of getTasksByStatus(column.status); let i = index"
        [@taskVariants]="'visible'"
        (@taskVariants.done)="onAnimationDone($event)"
      >
        <div
          class="bg-white/5 backdrop-blur-md rounded-lg p-4 shadow-md border border-white/10 flex justify-between items-start"
        >
          <div>
            <h3 class="text-lg font-semibold text-white">{{ task.title }}</h3>
            <p class="text-gray-300 mt-1 text-sm">{{ task.description }}</p>
          </div>
          <div class="flex gap-1.5">
            <button
              (click)="moveTask(task.id, 'To Do')"
              [disabled]="task.status === 'To Do'"
              class="text-gray-400 hover:text-blue-400"
              title="Move to To Do"
            >
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <button
              (click)="moveTask(task.id, 'In Progress')"
              [disabled]="task.status === 'In Progress'"
              class="text-gray-400 hover:text-yellow-400"
              title="Move to In Progress"
            >
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
            <button
              (click)="moveTask(task.id, 'Done')"
              [disabled]="task.status === 'Done'"
              class="text-gray-400 hover:text-green-400"
              title="Move to Done"
            >
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
            <button
              (click)="deleteTask(task.id)"
              class="text-gray-400 hover:text-red-400"
              title="Delete Task"
            >
              <i data-lucide="x-circle" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
      <div
        *ngIf="getTasksByStatus(column.status).length === 0"
        class="text-gray-400 text-sm italic"
      >
        No tasks in this column.
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
>
  <div
    class="bg-white/5 backdrop-blur-md rounded-lg p-6 shadow-lg border border-white/10 w-full max-w-md"
  >
    <h2 class="text-xl font-semibold text-white mb-4">Add New Task</h2>
    <div
      *ngIf="error"
      class="bg-red-500/20 text-red-400 p-3 rounded mb-4 flex items-start gap-2"
    >
      <i data-lucide="alert-triangle" class="h-4 w-4 mt-0.5 flex-shrink-0"></i>
      <p>{{ error }}</p>
    </div>
    <div class="space-y-4">
      <div class="space-y-2">
        <label for="title" class="text-sm font-medium block text-gray-200"
          >Title <span class="text-red-500">*</span></label
        >
        <input
          type="text"
          id="title"
          style="color: black"
          [(ngModel)]="newTask.title"
          placeholder="Task title"
          class="bg-black/20 text-white border border-gray-700 rounded p-2 w-full placeholder:text-gray-400"
        />
      </div>
      <div class="space-y-2">
        <label for="description" class="text-sm font-medium block text-gray-200"
          >Description</label
        >
        <textarea
          id="description"
          style="color: black"
          [(ngModel)]="newTask.description"
          placeholder="Task description"
          class="bg-black/20 text-white border border-gray-700 rounded p-2 w-full placeholder:text-gray-400"
        ></textarea>
      </div>
      <div class="space-y-2">
        <label for="status" class="text-sm font-medium block text-gray-200"
          >Status</label
        >
        <select
          id="status"
          [(ngModel)]="newTask.status"
          class="bg-black/20 text-white border border-gray-700 rounded p-2 w-full"
        >
          <option style="color: black" value="To Do">To Do</option>
          <option style="color: black" value="In Progress">In Progress</option>
          <option style="color: black" value="Done">Done</option>
        </select>
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-4">
      <button
        (click)="closeDialog()"
        class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded"
      >
        Cancel
      </button>
      <button
        (click)="addTask()"
        [disabled]="isLoading"
        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded"
      >
        <span *ngIf="isLoading">
          <i data-lucide="loader-2" class="mr-2 h-4 w-4 animate-spin"></i>
          Adding...
        </span>
        <span *ngIf="!isLoading">Add Task</span>
      </button>
    </div>
  </div>
</div>
